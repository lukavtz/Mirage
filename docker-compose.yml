services:
  panel:
    build:
      context: .
      dockerfile: panel/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - panel-data:/app/data
    environment:
      - DB_PATH=data/mirage.db
      - JWT_SECRET=local-dev-secret-change-in-prod-64chars0000000000000000000000
      - ALLOWED_ORIGINS=http://localhost:8080
    restart: unless-stopped
volumes:
  panel-data:
