<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#12122e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0088ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff3366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6633;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0088ff;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .title { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 52px; fill: #fff; }
      .subtitle { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 16px; fill: #8888aa; }
      .tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #aabbcc; }
      .tag-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #556677; text-transform: uppercase; letter-spacing: 1px; }
      .value { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #fff; font-weight: 700; }
      .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #667788; text-transform: uppercase; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="16"/>

  <!-- Grid lines -->
  <line x1="0" y1="0" x2="0" y2="300" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="100" y1="0" x2="100" y2="300" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="200" y1="0" x2="200" y2="300" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="300" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="400" y1="0" x2="400" y2="300" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="500" y1="0" x2="500" y2="300" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="300" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="700" y1="0" x2="700" y2="300" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="800" y1="0" x2="800" y2="300" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="300" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="1000" y1="0" x2="1000" y2="300" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="1100" y1="0" x2="1100" y2="300" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="1200" y1="0" x2="1200" y2="300" stroke="#1a1a3e" stroke-width="0.5"/>

  <!-- Accent glow -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)" rx="2"/>
  <rect x="0" y="296" width="1200" height="4" fill="url(#accent2)" rx="2"/>

  <!-- Left decorative element -->
  <rect x="30" y="40" width="3" height="60" fill="url(#accent)" rx="1.5" opacity="0.6"/>
  <rect x="30" y="110" width="3" height="30" fill="url(#accent2)" rx="1.5" opacity="0.4"/>

  <!-- Title -->
  <text x="50" y="82" class="title" filter="url(#shadow)">mirage</text>
  <text x="240" y="82" class="title" fill="url(#accent)" filter="url(#shadow)">stealer</text>

  <!-- Subtitle -->
  <text x="52" y="112" class="subtitle">Windows x64 · Zig 0.16 · Go C2 Panel</text>

  <!-- Badge line -->
  <rect x="50" y="130" width="60" height="20" rx="4" fill="#00d4aa" opacity="0.15"/>
  <text x="54" y="143" class="tag" fill="#00d4aa">v2.0</text>
  <rect x="118" y="130" width="70" height="20" rx="4" fill="#ff3366" opacity="0.15"/>
  <text x="122" y="143" class="tag" fill="#ff6688">283/283</text>
  <rect x="196" y="130" width="85" height="20" rx="4" fill="#0088ff" opacity="0.15"/>
  <text x="200" y="143" class="tag" fill="#44aaff">38K LOC</text>

  <!-- Right section: Architecture diagram -->
  <text x="750" y="55" class="stat-label">ARCHITECTURE</text>

  <!-- Stealer box -->
  <rect x="750" y="68" width="400" height="56" rx="8" fill="url(#glow)" stroke="#00d4aa" stroke-width="1" stroke-opacity="0.3"/>
  <text x="770" y="88" class="value" fill="#00d4aa">mirage.stealer</text>
  <text x="770" y="108" class="tag">Zig · Inline ASM · 30 Syscalls · ~120 KB</text>
  <text x="770" y="120" class="tag" fill="#556677">comptime XOR · Halo's Gate · stack spoofing</text>

  <!-- Arrow -->
  <line x1="950" y1="126" x2="950" y2="144" stroke="#445566" stroke-width="1.5"/>
  <polygon points="946,142 950,150 954,142" fill="#445566"/>

  <!-- Panel box -->
  <rect x="750" y="152" width="400" height="56" rx="8" fill="url(#glow)" stroke="#0088ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="770" y="172" class="value" fill="#44aaff">mirage.panel</text>
  <text x="770" y="192" class="tag">Go · chi-router · SQLite/PG · React SPA</text>
  <text x="770" y="204" class="tag" fill="#556677">JWT · RBAC · TOTP 2FA · WebSocket</text>

  <!-- Bottom stats bar -->
  <rect x="30" y="175" width="340" height="105" rx="10" fill="#0d0d24" stroke="#1a1a3e" stroke-width="1"/>

  <text x="50" y="195" class="stat-label">STEALER COVERAGE</text>

  <!-- Browsers -->
  <rect x="50" y="208" width="70" height="28" rx="4" fill="#1a1a3e"/>
  <text x="54" y="226" class="value" fill="#00d4aa">68</text>
  <text x="82" y="226" class="tag" fill="#8899aa">browsers</text>

  <!-- Wallets -->
  <rect x="135" y="208" width="70" height="28" rx="4" fill="#1a1a3e"/>
  <text x="139" y="226" class="value" fill="#44aaff">134</text>
  <text x="168" y="226" class="tag" fill="#8899aa">wallets</text>

  <!-- VPN -->
  <rect x="218" y="208" width="65" height="28" rx="4" fill="#1a1a3e"/>
  <text x="222" y="226" class="value" fill="#ff6688">18</text>
  <text x="248" y="226" class="tag" fill="#8899aa">VPN</text>

  <!-- Messengers -->
  <rect x="295" y="208" width="60" height="28" rx="4" fill="#1a1a3e"/>
  <text x="299" y="226" class="value" fill="#ffaa44">15</text>
  <text x="322" y="226" class="tag" fill="#8899aa">msg</text>

  <!-- Second row of coverage -->
  <rect x="50" y="244" width="70" height="24" rx="4" fill="#1a1a3e" opacity="0.7"/>
  <text x="54" y="260" class="tag" fill="#aabbcc">96 ext</text>

  <rect x="130" y="244" width="80" height="24" rx="4" fill="#1a1a3e" opacity="0.7"/>
  <text x="134" y="260" class="tag" fill="#aabbcc">38 desk</text>

  <rect x="220" y="244" width="85" height="24" rx="4" fill="#1a1a3e" opacity="0.7"/>
  <text x="224" y="260" class="tag" fill="#aabbcc">2FA + PM</text>

  <!-- Panel stats on right -->
  <text x="50" y="265" class="stat-label" fill="#445566">EDR bypass · anti-analysis (15 checks) · persistence (4 methods)</text>
</svg>
