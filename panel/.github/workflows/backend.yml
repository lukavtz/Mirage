name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mirage
          POSTGRES_USER: mirage
          POSTGRES_PASSWORD: mirage
        options: >-
          --health-cmd "pg_isready -U mirage -d mirage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://mirage:mirage@localhost:5432/mirage?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test backend
        run: go test ./internal/...

      - name: Vet backend
        run: go vet ./...

      - name: Build backend
        run: go build ./...
