services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mirage
      POSTGRES_USER: mirage
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirage -d mirage"]
      interval: 10s
      timeout: 3s
      retries: 5
    # ponytail: no host port mapping — the panel is the only client; keep PG
    # off the LAN. Expose 5432 explicitly when you need psql from the host.

  panel:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      APP_ENV: ${APP_ENV:-development}
      TLS_ENABLED: ${TLS_ENABLED:-false}
      TLS_SELF_SIGNED: ${TLS_SELF_SIGNED:-false}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/run/secrets/tls.crt}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/run/secrets/tls.key}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      LICENSE_SECRET: ${LICENSE_SECRET:-}
    volumes:
      - panel-data:/app/data
      - ${TLS_CERT_HOST_FILE:-./data/certs/cert.pem}:/run/secrets/tls.crt:ro
      - ${TLS_KEY_HOST_FILE:-./data/certs/key.pem}:/run/secrets/tls.key:ro
    ports:
      - "${PANEL_PORT:-8080}:8080"

  # Run with: docker compose --profile backup run --rm backup
  backup:
    image: postgres:16-alpine
    profiles: [backup]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:-}
      BACKUP_OFFSITE_REQUIRED: ${BACKUP_OFFSITE_REQUIRED:-false}
    volumes:
      - panel-backups:/backups
      - ${BACKUP_OFFSITE_DIR:-./offsite-backups}:/offsite-backups
    command:
      - sh
      - -ec
      - |
        case "$$BACKUP_RETENTION_DAYS" in ''|*[!0-9]*) echo 'BACKUP_RETENTION_DAYS must be a non-negative integer' >&2; exit 1;; esac
        dump="/backups/mirage-$$(date -u +%Y%m%dT%H%M%SZ).dump"
        pg_dump --format=custom --no-owner --file="$$dump" "$$DATABASE_URL"
        pg_restore --list "$$dump" >/dev/null
        find /backups -maxdepth 1 -type f -name 'mirage-*.dump' -mtime +"$$BACKUP_RETENTION_DAYS" -delete
        if [ -n "$$BACKUP_OFFSITE_DIR" ]; then
          mkdir -p /offsite-backups
          cp --reflink=auto "$$dump" /offsite-backups/
        elif [ "$$BACKUP_OFFSITE_REQUIRED" = "true" ]; then
          echo 'BACKUP_OFFSITE_DIR is required by BACKUP_OFFSITE_REQUIRED' >&2
          exit 1
        fi
        echo 'Backup and restore check complete'

volumes:
  pgdata:
  panel-data:
  panel-backups:
