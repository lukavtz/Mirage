services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mirage
      POSTGRES_USER: mirage
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirage -d mirage"]
      interval: 10s
      timeout: 3s
      retries: 5
    # ponytail: no host port mapping — the panel is the only client; keep PG
    # off the LAN. Expose 5432 explicitly when you need psql from the host.

  panel:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      LICENSE_SECRET: ${LICENSE_SECRET:-}
    ports:
      - "${PANEL_PORT:-8080}:8080"
    volumes:
      - panel-data:/app/data

  # Run with: docker compose --profile backup run --rm backup
  backup:
    image: postgres:16-alpine
    profiles: [backup]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
    volumes:
      - panel-backups:/backups
    command:
      - sh
      - -ec
      - |
        dump="/backups/mirage-$$(date -u +%Y%m%dT%H%M%SZ).dump"
        pg_dump --format=custom --no-owner --file="$$dump" "$$DATABASE_URL"
        pg_restore --list "$$dump" >/dev/null
        echo "Backup and restore check complete: $$dump"

volumes:
  pgdata:
  panel-data:
  panel-backups:
